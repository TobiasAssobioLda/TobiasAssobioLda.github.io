<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tobias &amp; Assobio, Lda</title>
  <link rel="preload" as="image" href="/capa/cover.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #f4f2f7;
      overflow: hidden;
    }
    .gate-screen {
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background:
        radial-gradient(900px 700px at 50% -20%, rgba(180, 60, 255, 0.22), transparent 55%),
        radial-gradient(600px 500px at 100% 100%, rgba(255, 40, 140, 0.12), transparent 50%),
        #07040f;
    }
    .gate-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      width: min(100%, 480px);
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 120, 220, 0.08),
        0 0 48px rgba(170, 60, 255, 0.15);
    }
    .gate-cover-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #120818;
    }
    .gate-cover {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .gate-panel {
      flex: 0 0 auto;
      padding: 0.9rem 1.1rem 1rem;
      background: linear-gradient(
        180deg,
        rgba(18, 8, 28, 0.72) 0%,
        rgba(10, 5, 18, 0.92) 100%
      );
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .gate-btn {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-align: center;
      text-decoration: none;
      text-transform: lowercase;
      color: #fff;
      background: linear-gradient(135deg, #ff3db8 0%, #9b4dff 52%, #4d8dff 100%);
      box-shadow:
        0 10px 28px rgba(155, 77, 255, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .gate-btn:hover { filter: brightness(1.06); }
    .gate-btn:active { transform: scale(0.985); }
    @media (max-width: 480px) {
      .gate-screen { padding: 0.75rem; }
      .gate-card { border-radius: 18px; }
      .gate-panel { padding: 0.75rem 0.9rem 0.9rem; }
    }
    @media (max-height: 500px) {
      .gate-panel { padding: 0.5rem 0.9rem 0.6rem; }
      .gate-btn { padding: 0.55rem 1rem; }
    }
  </style>
</head>
<body>
  <main class="gate-screen">
    <div class="gate-card">
      <div class="gate-cover-wrap">
        <img src="/capa/cover.png" alt="Tobias &amp; Assobio, Lda" class="gate-cover"
             width="1054" height="1492" decoding="async" />
      </div>
      <div class="gate-panel">
        <a class="gate-btn" href="/main.html">OK</a>
      </div>
    </div>
  </main>
</body>
</html>
